<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crochet Counter</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e6eee8">
    <style>
        :root {
            --bg-color: #e6eee8;
            --main-green: #5a8067;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--main-green);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none; /* Prevents text highlighting on rapid tapping */
        }

        .counter-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .label {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background-color: var(--main-green);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            touch-action: manipulation; /* Optimizes touch responsiveness */
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        .restore-btn {
    display: none;
    touch-action: pan-y;
    background-color: var(--main-green);
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1.1rem;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    margin-top: 15px;
}


        .circle {
            width: 120px;
            height: 120px;
            border: 2px solid var(--main-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            background: transparent;
        }

        .gear-icon {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 45px;
    height: 45px;
    color: var(--main-green);
    opacity: 0.25;        
    cursor: pointer;
}

.gear-icon svg {
    width: 100%;
    height: 100%;
    fill: currentColor; /* Forces the SVG to inherit the color defined above */
}

#notification {
    background-color: var(--main-green);
    color: white;
    padding: 12px 24px;
    border-radius: 25px;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    margin: 10px 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
}

#notification:empty {
    display: none;
}

#notificationModal {
    color: white;
    background-color: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    text-align: center;
}

#notificationModal:empty {
    display: none;
}

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 30px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 2px solid var(--main-green);
        }

        .modal-content label {
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .modal-content input {
            width: 60px;
            font-size: 1.2rem;
            padding: 5px;
            border: 1px solid var(--main-green);
            border-radius: 5px;
            text-align: center;
        }

        .save-btn {
            background-color: var(--main-green);
            color: white;
            border: none;
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="counter-section">
        <div class="label">Stitches</div>
        <div class="controls">
            <button class="btn" id="stitchMinus">-</button>
            <div class="circle" id="stitchDisplay">0</div>
            <button class="btn" id="stitchPlus">+</button>
        </div>
    </div>

    <div class="counter-section">
        <div class="label">Rows</div>
        <div class="controls">
            <button class="btn" id="rowMinus">-</button>
            <div class="circle" id="rowDisplay">0</div>
            <button class="btn" id="rowPlus">+</button>
        </div>
    </div>

    <div id="notification"></div>
    <div class="restore"><button class="restore-btn" id="restoreBtn">Restore stitch count</button></div>
    
    <div class="gear-icon" id="settingsBtn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
    </div>
    
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2 style="margin-top:0;">Project Setup</h2>
            <label>
                Stitches per row:
                <input type="number" id="stitchesPerRowInput" value="40" min="1">
            </label>
            <label>
                Total rows goal:
                <input type="number" id="totalRowsInput" value="10" min="1">
            </label>
            <div id="notificationModal"></div>
            <button class="save-btn" id="saveSettingsBtn">Save & Close</button>
        </div>
    </div>

    <script>
        // State variables
        let stitches = 0;
        let rows = 0;
        let stitchesPerRow = 40; 
        let totalRows = 10;
        let storedStitches = 0;
        let startX = 0;
        
        // DOM Elements
        const stitchDisplay = document.getElementById('stitchDisplay');
        const rowDisplay = document.getElementById('rowDisplay');
        const notification = document.getElementById('notification');
        const notificationModal = document.getElementById('notificationModal');
        const restoreBtn = document.getElementById('restoreBtn');
        
        // Update the screen
        function updateDisplay() {
            stitchDisplay.innerText = stitches;
            rowDisplay.innerText = rows;
            
            // Save state to local storage so progress isn't lost if app is closed
            localStorage.setItem('crochetStitches', stitches);
            localStorage.setItem('crochetRows', rows);
            localStorage.setItem('crochetStitchesPerRow', stitchesPerRow);
            localStorage.setItem('crochetTotalRows', totalRows);
        }

        // Load saved data if it exists
        window.onload = () => {
            if(localStorage.getItem('crochetStitchesPerRow')) {
                stitches = parseInt(localStorage.getItem('crochetStitches')) || 0;
                rows = parseInt(localStorage.getItem('crochetRows')) || 0;
                stitchesPerRow = parseInt(localStorage.getItem('crochetStitchesPerRow')) || 40;
                document.getElementById('stitchesPerRowInput').value = stitchesPerRow;
                totalRows = parseInt(localStorage.getItem('crochetTotalRows')) || 10;
                document.getElementById('totalRowsInput').value = totalRows;
            }
            updateDisplay();
        };

        // Functions

        function updateText(notificationText) {
            notification.innerText = notificationText;
        }

        function updateTextModal(notificationModalText) {
            notificationModal.innerText = notificationModalText;
        }

        function doMath() {
            if (rows === totalRows) {
               updateText("Congratulations, you've finished!"); }
            else {
               updateText(""); }
        }

        // --- STITCH LOGIC ---
        document.getElementById('stitchPlus').addEventListener('click', () => {
            if (rows < totalRows) {
               stitches++;
               if (stitches >= stitchesPerRow) {
                   stitches = 0;
                   rows++;
                   }
               updateDisplay();
               doMath();
               }
            else {
               updateText("Please change total rows goal if you wish to continue →"); }
        });

        document.getElementById('stitchMinus').addEventListener('click', () => {
            if (stitches === 0) {
                if (rows > 0) {
                    rows--;
                    stitches = stitchesPerRow - 1;
                }
            } else {
                stitches--;
            }
            updateDisplay();
            updateText("");
        });

        // --- ROW LOGIC ---
        document.getElementById('rowPlus').addEventListener('click', () => {
            if (rows < totalRows) {
               rows++;
               doMath();
               if (rows === totalRows) {
                  storedStitches = stitches;
                  stitches = 0;
                  updateDisplay();
                  restoreBtn.style.display = 'flex';
                  }
               else { updateDisplay(); }
               }
            else {
               updateText("Please change total rows goal if you wish to continue →") };               
        });

        document.getElementById('rowMinus').addEventListener('click', () => {
            if (rows > 0) {
                rows--;
            }
            updateDisplay();
            updateText("");
        });

        // --- RESTORE LOGIC ---
        document.getElementById('restoreBtn').addEventListener('click', () => {
            stitches = storedStitches;
            rows = totalRows - 1;
            updateDisplay();
            doMath();
            restoreBtn.style.display = 'none';
        });

        restoreBtn.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            restoreBtn.style.transition = 'none';
        });

        restoreBtn.addEventListener('touchmove', (e) => {
            let currentX = e.touches[0].clientX;
            let distance = currentX - startX;
            restoreBtn.style.transform = `translateX(${distance}px)`;
        });

        restoreBtn.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].clientX;
            let totalDistance = endX - startX;  
            if (Math.abs(totalDistance) > window.innerWidth / 3) {
                restoreBtn.style.transform = `translateX(0px)`;
                restoreBtn.style.display = 'none';
            } else {
                restoreBtn.style.transition = 'transform 0.3s ease-out';
                restoreBtn.style.transform = `translateX(0px)`;
            }
        });
        
        // --- SETTINGS LOGIC ---
        const modal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            const inputTotalRows = parseInt(document.getElementById('totalRowsInput').value) || 1;
            if (rows > inputTotalRows || (rows === inputTotalRows && stitches > 0)) {
               updateTextModal("You've already finished more rows than the goal"); 
            } else {
               totalRows = inputTotalRows;
               stitchesPerRow = parseInt(document.getElementById('stitchesPerRowInput').value) || 1;
               modal.style.display = 'none';
               updateDisplay();
               updateTextModal("");
               doMath();
            }
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
